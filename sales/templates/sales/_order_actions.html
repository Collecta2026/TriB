{% load i18n %}{% if can.sales.edit %}<form method="post" action="{% url 'sales:order_action' doc.pk %}" class="toolbar">{% csrf_token %}
  {% if doc.status == "draft" %}<button class="btn primary" name="action" value="confirm">{% translate "Confirm order" %}</button>{% endif %}
  {% if doc.status == "open" or doc.status == "partial" %}<button class="btn primary" name="action" value="invoice">{% translate "Create invoice" %}</button>{% endif %}
  {% if doc.status == "draft" or doc.status == "open" %}<button class="btn danger" name="action" value="cancel">{% translate "Cancel order" %}</button>{% endif %}
</form>{% endif %}
