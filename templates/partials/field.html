<div class="field{% if wide %} wide{% endif %}"{% if method %} data-method="{{ method }}"{% endif %}>
  {% if f.field.widget.input_type == "checkbox" %}
  <label class="check">{{ f }} {{ f.label }}</label>
  {% else %}
  <label for="{{ f.id_for_label }}">{{ f.label }}</label>
  {{ f }}
  {% endif %}
  {% if f.help_text %}<span class="help">{{ f.help_text }}</span>{% endif %}
  {% if f.errors %}{{ f.errors }}{% endif %}
</div>
