{% load static i18n %}<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ spec.print_en }} {{ doc.number }} · {{ company.name_en }}</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/trib.css' %}?v=g1">
  <style>body{background:var(--surface-2)}.shared{max-width:960px;margin:0 auto;padding:16px}.shared-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}{% if embed %}.shared{padding:0}.shared-bar{display:none}body{background:#fff}{% endif %}</style>
</head>
<body>
<div class="shared">
  <div class="shared-bar no-print"><b>{{ company.name_en }}{% if company.name_ar %} · <span lang="ar">{{ company.name_ar }}</span>{% endif %}</b>
    <div class="toolbar"><button class="btn primary" type="button" onclick="window.print()">Print / طباعة</button>
      <button class="btn" type="button" onclick="window.print()">Download PDF / تنزيل</button></div></div>
  {% include "docs/_print_body.html" %}
</div>
</body>
</html>
