{% load i18n %}<form method="get" class="toolbar">
  {% if show_from %}<label class="lbl">{% translate "From" %} <input type="date" name="from" value="{{ from|date:'Y-m-d' }}" style="width:auto"></label>{% endif %}
  <label class="lbl">{% if show_from %}{% translate "To" %}{% else %}{% translate "As of" %}{% endif %} <input type="date" name="to" value="{{ to|date:'Y-m-d' }}" style="width:auto"></label>
  {% if extra %}{{ extra }}{% endif %}
  <button class="btn" type="submit">{% translate "Run report" %}</button>
</form>
