{% load i18n %}
{% if doc.status == "draft" and can.purchases.post %}<form method="post" action="{% url 'purchases:supplier_credit_action' doc.pk %}">{% csrf_token %}<button class="btn primary" name="action" value="post">{% translate "Post supplier credit" %}</button></form>{% endif %}
{% if doc.status == "posted" and not doc.amount_applied and can.purchases.void %}<form method="post" action="{% url 'purchases:supplier_credit_action' doc.pk %}">{% csrf_token %}<button class="btn danger" name="action" value="void">{% translate "Void" %}</button></form>{% endif %}
